<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">皇室战争 徽章图鉴 · Clash Royale Badge Gallery</title>
<style>
:root{
  --bg:#f5f4fb; --ink:#171331; --ink2:#4e4a6b; --ink3:#8b86a8;
  --line:#e5e3f1; --card:#ffffff;
  --blue:#5b46e0; --gold:#d99a1a; --red:#dd3f56;
  --radius:14px;
  --shadow:0 1px 2px rgba(24,18,60,.05), 0 8px 24px -12px rgba(24,18,60,.2);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#f0ecfb 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#1a1040 0%,#3b1f7a 45%,#6b34c8 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 320px at 12% -10%,rgba(196,150,255,.32),transparent 60%),
  radial-gradient(600px 300px at 88% 0%,rgba(255,214,120,.2),transparent 60%)}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:78ch;color:rgba(255,255,255,.76);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(24,18,60,.5)}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,70,224,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none}
.tgl:hover{border-color:#cfc8ec}
.tgl.on{background:linear-gradient(180deg,#6b46e0,#4b2fbb);border-color:#4b2fbb;color:#fff;font-weight:600}
.tgl.gold.on{background:linear-gradient(180deg,#e8a92c,#cf8f0f);border-color:#cf8f0f;color:#3a2600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
main{padding:20px 0 70px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:13px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d3cbef}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .stripe{height:3px;background:var(--hc,#94a3b8)}
.thumb{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 34%,#f3efff,#e6e0f8);border-bottom:1px solid #ece8f8;
  overflow:hidden;padding:8px}
.thumb img{max-height:94%;max-width:94%;object-fit:contain;transition:transform .18s ease}
.card:hover .thumb img{transform:scale(1.05)}
.badge{position:absolute;top:7px;right:7px;z-index:2;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px;background:#efeaff;color:#4b2fbb;border:1px solid #d5caf7}
.badge.dis{background:#f2f3f7;color:#8792ad;border-color:#dfe3ee}
.badge.ty{left:7px;right:auto;background:#eaf7ef;color:#1a7a4a;border-color:#c4e6d3}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{font-size:11px;padding:2px 7px;border-radius:6px;background:#efeaff;color:#4b2fbb;font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(18,14,44,.58);backdrop-filter:blur(4px)}
.lb-panel{position:relative;background:#fff;border-radius:18px;width:min(940px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(12,8,36,.55);display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr)}
@media(max-width:800px){.lb-panel{grid-template-columns:1fr}}
.lb-vis{background:radial-gradient(circle at 50% 34%,#f6f2ff,#e7e0f8);padding:24px 20px 18px;
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center}
.lb-vis .big{display:flex;align-items:center;justify-content:center;min-height:230px}
.lb-vis .big img{max-height:min(38vh,280px);max-width:100%;object-fit:contain}
.lvstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.lvstrip button{flex:0 0 auto;width:52px;height:52px;padding:2px;border:1px solid var(--line);border-radius:9px;
  background:#fff;cursor:pointer;display:grid;place-items:center;position:relative}
.lvstrip button img{max-width:100%;max-height:100%;object-fit:contain}
.lvstrip button i{position:absolute;bottom:-1px;right:1px;font-size:9px;font-style:normal;font-weight:700;
  color:#4b2fbb;background:#efeaff;border-radius:4px;padding:0 3px;line-height:1.4}
.lvstrip button.on{border-color:#5b46e0;box-shadow:0 0 0 2px rgba(91,70,224,.18)}
.lb-info{padding:22px 24px 26px;min-width:0}
.lb-info h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:14px}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f1f2f9;color:var(--ink2);font-weight:600}
.tg.g{background:#eaf7ef;color:#1a7a4a}
.tg.b{background:#efeaff;color:#4b2fbb}
.tg.gold{background:#fff6e0;color:#8a5c00}
.tg.grey{background:#f2f3f7;color:#8792ad}
.lb-desc{font-size:13px;color:var(--ink2);background:#faf9ff;border:1px solid #eeebfa;border-radius:10px;
  padding:10px 12px;margin-bottom:14px;line-height:1.6}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
dt{color:var(--ink3);white-space:nowrap}
dd{margin:0;color:var(--ink);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.lvlist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.lvlist h3{margin:0 0 8px;font-size:12.5px;color:var(--ink3);font-weight:600}
.lvlist ol{margin:0;padding-left:22px;font-size:13px;color:var(--ink2)}
.lvlist li{margin:3px 0}
.lvlist li.on{color:var(--ink);font-weight:650}
.lvlist li span{color:var(--ink3);font-weight:400;font-size:12.5px}
.lb-nav{position:absolute;top:12px;right:14px;display:flex;gap:6px}
.lb-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--ink2);font-size:15px;line-height:1;display:grid;place-items:center}
.lb-nav button:hover{background:#f5f3fb;border-color:#cfc8ec}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:22px 0 40px}
footer code{background:#f0eef9;padding:1.5px 5px;border-radius:5px;font-size:12px;color:var(--ink2)}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grp .tgl{border:none;border-radius:0;font-size:13px;padding:9px 11px}
.grp .tgl + .tgl{border-left:1px solid var(--line)}
.grp .tgl.on{font-weight:600}
</style>
</head>

const B = META.badges;
const IMG = META.css;

/* 类型名：中文用官中稀有度译名，英文保持游戏内写法 */
const TYPEZH = {Common:"普通", Rare:"稀有", Epic:"史诗", Legendary:"传说", Champion:"冠军", Archived:"归档"};
function typeLabel(t){ return window.LANG === 'en' ? (t||"") : (TYPEZH[t] || t || ""); }
/* 名称取当前语言，缺则该语言回退另一语言 */
function nm(o){ return window.LANG === 'en' ? (o.t || o.z || o.n) : (o.z || o.t || o.n); }
function lvName(lv, i){ return nm({t:lv.t, z:lv.z}) || T('lvN', i+1); }
const TYPE_COLOR = {Common:"#8792ad", Rare:"#e08b1e", Epic:"#a259e0", Legendary:"#e0553d", Champion:"#d9a520", Archived:"#6b7a8f"};

(function(){
  const ty = new Set(B.map(x=>x.ty));
  const multi = B.filter(x=>x.lv.length>1).length;
  const dis = B.filter(x=>x.dis).length;
  document.getElementById('lead').textContent = ``;
  const S=[[B.length,T("stBadges")],[META.levelTotal,T("stLevels")],[ty.size,T("stTypes")],
           [multi,T("stMulti")],[dis,T("stDis")]];
  document.getElementById('stats').innerHTML = S.map(([v,l],i)=>
    `<div class="stat${i===4?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const drop = META.droppedCount | 0;
  const part = META.partialCount | 0;
  window.__foot = function(){
    const el = document.getElementById('f-drop');
    let s = '';
    if(drop) s += T('dropNote', drop);
    if(part) s += (s ? ' ' : '') + T('partialFoot', part);
    el.textContent = s;
  };
})();

const tyCount={};
B.forEach(x=>{ if(x.ty) tyCount[x.ty]=(tyCount[x.ty]||0)+1; });
const tyKeys=Object.keys(tyCount);
const tySel=document.getElementById('ty');
/* 类型下拉跟随语言，option 的 value 始终是游戏内类型名 */
function buildTyOptions(){
  const cur=tySel.value;
  tySel.innerHTML='<option value="">'+T("tyAll")+'</option>'+
    tyKeys.slice().sort((a,b)=>tyCount[b]-tyCount[a]||a.localeCompare(b))
      .map(t=>`<option value="${esc(t)}">${esc(typeLabel(t))} (${tyCount[t]})</option>`).join('');
  tySel.value=cur;
}

const S = {q:"", ty:"", sort:"so", multi:false};
function match(x){
  if(S.ty && x.ty!==S.ty) return false;
  if(S.multi && x.lv.length<2) return false;
  if(S.q){
    const hay=(x.t+" "+x.z+" "+x.n+" "+x.ty+" "+x.lv.map(l=>l.x+" "+l.t+" "+l.z).join(" ")+" "+x.lv.map(l=>l.p).join(" ")).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function sortList(a,b){
  switch(S.sort){
    case "name": return nm(a).localeCompare(nm(b), window.LANG==='en'?'en':'zh-Hans-CN') || a.so-b.so;
    case "ty":   return (a.ty||"~").localeCompare(b.ty||"~") || a.so-b.so;
    case "lv":   return b.lv.length-a.lv.length || a.so-b.so;
    default:     return a.so-b.so || nm(a).localeCompare(nm(b));
  }
}
const IDX = new Map(B.map((x,i)=>[x,i]));
function idx(x){ return IDX.get(x); }

const grid=document.getElementById('grid'), countEl=document.getElementById('count'), emptyEl=document.getElementById('empty');
let VIEW=[];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function card(x){
  const top=x.lv[x.lv.length-1];
  const badges =
    `<div class="badge ty" title="${esc(typeLabel(x.ty))}">${esc(typeLabel(x.ty))}</div>`+
    `<div class="badge${x.lv.length>1?'':' dis'}" title="${T('levelCount')}">Lv ${x.lv.length}</div>`;
  return `<article class="card" tabindex="0" data-n="${esc(x.n)}">
    <div class="stripe" style="--hc:${TYPE_COLOR[x.ty]||'#8792ad'}"></div>
    <div class="thumb">${badges}<img loading="lazy" decoding="async" src="${IMG}${esc(top.x)}.png" alt="${esc(nm(x))}"></div>
    <div class="cbody">
      <div class="cname">${esc(nm(x))}</div>
      <div class="cmeta">
        <span class="fam" style="background:#f1f2f9;color:#4e4a6b">${esc(typeLabel(x.ty))}</span>
        ${x.missTxt?`<span class="fam" style="background:#fff6e0;color:#8a5c00" title="${esc(T('partialNote', x.missTxt))}">${T('partial')}</span>`:""}
        ${x.dis?`<span class="fam" style="background:#f2f3f7;color:#8792ad">${T('disabled')}</span>`:""}
        <span class="yr">#${x.so}</span>
      </div>
    </div>
  </article>`;
}
function render(){
  VIEW=B.filter(match).sort(sortList);
  countEl.innerHTML=T('countBadges', VIEW.length, B.length, VIEW.reduce((n,x)=>n+x.lv.length,0));
  emptyEl.style.display=VIEW.length?"none":"block";
  grid.innerHTML=VIEW.map(card).join('');
  if(window.__foot) window.__foot();
}
grid.addEventListener('click',ev=>{
  const c=ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(x=>x.n===c.dataset.n));
});
grid.addEventListener('keydown',ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const c=ev.target.closest('.card'); if(!c) return;
  ev.preventDefault(); openBy(VIEW.findIndex(x=>x.n===c.dataset.n));
});

const lb=document.getElementById('lb');
let cur=-1, lvCur=0;
function lvStrip(x){
  return `<div class="lvstrip">`+x.lv.map((lv,i)=>
    `<button class="${i===lvCur?'on':''}" data-lv="${i}" title="${esc(lvName(lv,i))}">
      <img src="${IMG}${esc(lv.x)}.png" alt="${esc(lvName(lv,i))}"><i>${i+1}</i></button>`).join('')+`</div>`;
}
function paint(){
  const x=VIEW[cur]; if(!x) return;
  const lv=x.lv[lvCur] || x.lv[0];
  document.getElementById('lb-vis').innerHTML =
    `<div class="big"><img src="${IMG}${esc(lv.x)}.png" alt="${esc(lvName(lv,lvCur))}"></div>`+lvStrip(x);
  const tgs=[`<span class="tg b">${esc(typeLabel(x.ty))}</span>`];
  if(x.lv.length>1) tgs.push(`<span class="tg g">${T('upgradable')}</span>`);
  if(x.dis) tgs.push(`<span class="tg grey">${T('disabled')}</span>`);
  if(x.hid) tgs.push(`<span class="tg gold">${T('hideNotEarned')}</span>`);
  const desc = window.LANG==='en' ? (lv.de||lv.dz) : (lv.dz||lv.de);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(nm(x))}</h2>
    <div class="lb-sub">${esc(typeLabel(x.ty))} · ${T("dataName")} ${esc(x.n)}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <div class="lb-desc">${esc(desc || T('noDesc'))}</div>` +
    (x.missTxt?`<div class="lb-desc" style="background:#fffaf0;border-color:#f3e2bd;color:#8a5c00">${esc(T('partialNote', x.missTxt))}</div>`:"") +
    `<dl>
      <dt>${T("currentLevel")}</dt><dd>${T("lvN", lvCur+1)} · ${esc(lvName(lv,lvCur))}</dd>
      <dt>${T("progress")}</dt><dd>${esc(lv.p || T('none'))}</dd>
      <dt>${T("levelCount")}</dt><dd>${x.lv.length}</dd>
      <dt>${T("sortOrder")}</dt><dd>${esc(x.so)}</dd>
      <dt>${T("exportName")}</dt><dd>${esc(lv.x)}</dd>
      <dt>${T("spriteFile")}</dt><dd>${esc(META.sc)}</dd>
    </dl>
    <div class="lvlist"><h3>${T("levelsTitle")}</h3><ol>`+
      x.lv.map((l,i)=>`<li class="${i===lvCur?'on':''}">${esc(lvName(l,i))}${l.p?` <span>· ${T("progress")} ${esc(l.p)}</span>`:""}</li>`).join('')+
    `</ol></div>`;
}
function openBy(i){
  if(i<0||i>=VIEW.length) return;
  cur=i; lvCur=0;
  paint();
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('lb-vis').addEventListener('click',ev=>{
  const b=ev.target.closest('.lvstrip button'); if(!b) return;
  lvCur=Number(b.dataset.lv); paint();
});
lb.addEventListener('click',ev=>{ if(ev.target.hasAttribute('data-close')) close(); });
document.getElementById('prev').onclick=()=>openBy(cur-1);
document.getElementById('next').onclick=()=>openBy(cur+1);
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('open')) return;
  if(ev.key==="Escape") close();
  if(ev.key==="ArrowLeft") openBy(cur-1);
  if(ev.key==="ArrowRight") openBy(cur+1);
  if(ev.key==="ArrowUp"){ const x=VIEW[cur]; if(x&&lvCur<x.lv.length-1){lvCur++;paint();} }
  if(ev.key==="ArrowDown"){ if(lvCur>0){lvCur--;paint();} }
});

let timer;
document.getElementById('q').addEventListener('input',ev=>{
  clearTimeout(timer); const v=ev.target.value;
  timer=setTimeout(()=>{S.q=v.trim(); render();},120);
});
document.getElementById('ty').onchange=ev=>{S.ty=ev.target.value; render();};
document.getElementById('sort').onchange=ev=>{S.sort=ev.target.value; render();};
(function(){
  const el=document.getElementById('t-multi');
  el.onclick=()=>{S.multi=!S.multi; el.classList.toggle('on',S.multi); render();};
})();
document.getElementById('reset').onclick=()=>{
  S.q="";S.ty="";S.sort="so";S.multi=false;
  document.getElementById('q').value="";document.getElementById('ty').value="";document.getElementById('sort').value="so";
  document.querySelectorAll('.tgl.on:not(#l-zh):not(#l-en)').forEach(el=>el.classList.remove('on'));
  render();
};
buildTyOptions();
render();
</script>
